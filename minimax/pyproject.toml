[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sddctx"
version = "0.1.0"
description = "Spec driven development context module for continuous software evolution."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pylibseekdb>=1.4.0.post2",
    "PyMySQL>=1.1",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
sddctx = "sddctx.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["sddctx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
