[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "demo-shop"
version = "0.1.0"
description = "Sample business project used by the MiniMax SDD context module."
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/shop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
